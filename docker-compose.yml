services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # 宿主 8000 被 china_platform 长期占用（cut-003 §7.2 #3）；容器内仍 8000，代码不变
      - "127.0.0.1:8765:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ece:ece@db:5432/ece
      ECE_LOG_LEVEL: INFO
    healthcheck:
      # python:3.12-slim 无 curl —— 用标准库 urllib（compose healthcheck 覆盖 Dockerfile HEALTHCHECK）
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-pgvector
    environment:
      POSTGRES_USER: ece
      POSTGRES_PASSWORD: ece
      POSTGRES_DB: ece
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ece -d ece"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
