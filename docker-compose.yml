services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ece:ece@db:5432/ece
      ECE_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-pgvector
    environment:
      POSTGRES_USER: ece
      POSTGRES_PASSWORD: ece
      POSTGRES_DB: ece
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ece -d ece"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
