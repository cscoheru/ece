# cut-045R2+ — Demo Deployment nginx for corln.rana.asia (HTTPS enabled)

upstream ece_api_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

# --- HTTP (port 80): ACME + redirect to HTTPS --------------------------
server {
    listen 80;
    listen [::]:80;
    server_name corln.rana.asia;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (port 443): full TLS termination ----------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name corln.rana.asia;

    ssl_certificate     /etc/letsencrypt/live/corln.rana.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corln.rana.asia/privkey.pem;

    # Modern TLS — disable old protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/ece/demos/spa;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://ece_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /healthz {
        proxy_pass http://ece_api_upstream/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}