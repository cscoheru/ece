# cut-045 — Demo Deployment Profile nginx config for corln.rana.asia.
#
# Scope lock (Codex directive §0):
#   - This is the "Demo Deployment Profile" for the founder's own server.
#   - NOT a customer-private installer (no K8s / multi-tenant / data isolation).
#
# Topology:
#   Browser (https://corln.rana.asia)
#       ↓
#   nginx (this file) — SPA static + /api/ reverse proxy + /healthz
#       ↓
#   docker compose (api service on internal network, port 8000)
#
# Required for cut-045 (binding tests verify every directive):
#   - root points to demos/spa/  (test_nginx_root_points_to_spa)
#   - /api/ location reverse-proxies to API upstream  (test_nginx_proxies_api_path)
#   - /healthz location reverse-proxies to API  (test_nginx_proxies_healthz)
#   - gzip on  (test_nginx_gzip_enabled)
#   - security headers (X-Frame-Options, X-Content-Type-Options, Referrer-Policy)  (test_nginx_security_headers)
#   - no external CDN (proxy_pass targets only localhost)  (test_nginx_no_external_cdn)
#   - HTTPS / certbot reference  (test_nginx_has_https_or_certbot_notes)

# --- Upstream ---------------------------------------------------------------
# R3-B1 fix (Codex R1 HOLD): the api container is now bound to the host
# loopback (127.0.0.1:8000) by deploy/docker-compose.demo.yml. nginx
# proxies /api/ + /healthz to this loopback endpoint. This is consistent
# with the README runbook (clone path /opt/ece) and eliminates the
# previous 502 topology where nginx targeted a port the docker container
# did not publish.
upstream ece_api_upstream {
    server 127.0.0.1:8000;  # api container bound to host loopback by compose
    keepalive 32;
}

# --- HTTP server (redirect to HTTPS) ----------------------------------------
# Once certbot issues a cert, uncomment the `return 301 ... https://$host$request_uri;`
# line below and add the HTTPS server block at the bottom.

server {
    listen 80;
    listen [::]:80;
    server_name corln.rana.asia;

    # ACME challenge path for certbot — DO NOT redirect this.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # TODO: Uncomment after `certbot --nginx -d corln.rana.asia` succeeds:
    # return 301 https://$host$request_uri;

    # Provisional reverse-proxy on plain HTTP (still same-origin, still secure headers).
    # Useful for the cut-045 demo deployment smoke before HTTPS is wired.

    # SPA static root — R3-B1 fix: path must match the README clone path.
    # The runbook clones to /opt/ece; demos/spa lives there. Operators
    # running nginx on a different host (e.g. a separate reverse-proxy
    # machine) must adjust this root + grant the nginx user read access.
    root /opt/ece/demos/spa;
    index index.html;

    # gzip on — directive §4.2.4
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    # Security headers — directive §4.2.5
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /api/ reverse proxy — directive §4.2.2
    location /api/ {
        proxy_pass http://ece_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # /healthz reverse proxy — directive §4.2.3
    location = /healthz {
        proxy_pass http://ece_api_upstream/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA static files — directive §4.2.1
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- HTTPS server (uncomment after certbot issues the cert) ----------------
#
# Steps:
#   1. certbot certonly --webroot -w /var/www/letsencrypt -d corln.rana.asia
#   2. Uncomment below, adjust ssl_certificate paths.
#   3. nginx -t && systemctl reload nginx
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name corln.rana.asia;
#
#     ssl_certificate     /etc/letsencrypt/live/corln.rana.asia/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/corln.rana.asia/privkey.pem;
#
#     # ... (same root, gzip, security headers, /api/, /healthz, / as above) ...
# }