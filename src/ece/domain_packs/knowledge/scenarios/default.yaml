pack: knowledge
spec: evaluate_policy_question
# cut-043 — 业务语言域标签 (与 procurement 同构; 由 _discover_domains 读取)
label: "制度知识审查"
# cut-043 — 独立 source_system (与 spike:v0-technical-fixture 物理隔离)
source_system: "km:v0-knowledge-fixture"
# cut-043 — 默认根实体 (test 兜底; 真实路由走 route_root_via_params)
default_root_source_id: "KM-POL-001"
# cut-043 — 显式 opt-in: API 层检测到此 flag 时, 用 params[root_params_fields[0]]
# 作为 root_source_id (而非 default_root_source_id). KM 域的 root 实体由 params 决定,
# procurement 域的 root 实体固定为 SPIKE-PR-001 — 两条不同路径.
route_root_via_params: true
# cut-043R R5-B1 — `today` 是制度有效期的裁定基准, 不能由请求方控制.
# API 层检测到本 flag 时:
#   1) 拒绝任何 req.params.today (422 — client 无 authority 改写有效期)
#   2) 从 ECE_SERVER_TODAY_ANCHOR 或 fallback (date.today) 注入 today 到 params
requires_server_today_anchor: true
# cut-043R R5-B2 — `needs_valid_policy` 是合法业务结论 (双条件失败时),
# 不要求 evidence row. generic loop 与 apply_context_update 按此 allowlist 放行 0 evidence.
zero_evidence_decisions:
  - needs_valid_policy
root_entity:
  type: policy_document
  id_field: source_id
subject_entity_type: policy_document
rule_id: R-KM-ACCESS
# cut-043 — keep decision_key="review_status" to reuse S4 apply_context_update's
# write-back path (which is currently locked to the four `review_*` JSONB keys).
# The domain semantics (KM access vs procurement review) live in `decision_value`
# ("answerable" / "needs_valid_policy") and the `reason` string; the column name
# is the storage slot, not the business concept.
decision_key: review_status
# cut-043R R5-B4 — KM 不再需要 employee_id 参数. 员工身份统一来自 X-User-Id
# (assemble_context 已将 caller identity 含 roles 注入 ctx.user);规则层读 ctx.user,
# 避免出现"看似可指定他人, 实际不生效"的误导性参数.
root_params_fields:
  - policy_id
params_schema:
  policy_id: str
denied_users:
  - km-eve
