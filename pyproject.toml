[project]
name = "ece"
version = "0.1.0"
description = "Enterprise Context Engine v0 — Procurement domain pack validation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "uvicorn>=0.30",
    # NOTE: mcp 故意不在 S0.1 依赖（Sprint 4 S4.5 MCP Tool Layer 动工时引入，per ADR-004）。
    # NOTE: openai SDK 不在 S0.1 — LLM 客户端在 Sprint 5（Procurement Agent）加入。
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]  # line-too-long

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "integration: integration tests (require live postgres)",
    "security: security / permission / E2 tests",
    "eval: E1-E6 evaluation suite (needs LLM endpoint)",
    "eval_llm: LLM-backed evaluation cases",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ece*"]
namespaces = false

[tool.setuptools.package-dir]
"" = "src"

[tool.importlinter]
root_packages = ["ece"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Domain pack isolation"
type = "forbidden"
source_modules = ["ece"]
forbidden_modules = ["ece.domain_packs"]

[[tool.importlinter.contracts]]
name = "Engine core isolation"
type = "forbidden"
source_modules = ["ece.domain_packs"]
forbidden_modules = ["ece"]
