name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: API docs consistency
        run: make check-api-docs

      - name: Mypy (type check)
        run: uv run mypy src tests

      - name: Import-linter (architecture contract)
        run: uv run lint-imports

      - name: Pytest (unit + integration + security)
        run: uv run pytest -m "not eval and not eval_llm" --cov=ece --cov-report=term-missing

      - name: Build (sanity)
        run: uv run python -c "import ece.main; print('build ok:', ece.main.app.title)"
