name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      # cut-005R Cline supplement: integration tests (R4) need a live postgres.
      # 0001 migration runs CREATE EXTENSION vector -> must be the pgvector image.
      # docker.io pulls directly on GH runners (daocloud mirror issue is local-only).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ece
          POSTGRES_PASSWORD: ece
          POSTGRES_DB: ece
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ece -d ece"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # ece.db default; explicit for clarity (service is reachable on localhost:5432)
      DATABASE_URL: postgresql+psycopg://ece:ece@localhost:5432/ece

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (--frozen for reproducible CI)
        run: uv sync --frozen --all-groups

      - name: Generate demo dataset (deterministic, S0.6)
        run: make gen-dataset

      - name: Verify demo.json md5 baseline (cut-005 R5 integrity lock)
        run: |
          echo "f98a76ca10a025d530e1d018582a13ca  data/dataset/demo.json" | md5sum -c -

      - name: Migrate (alembic 0001→0007)
        run: uv run alembic -c src/ece/migrations/alembic.ini upgrade head

      - name: Verify migrations replay cleanly (cut-035 regression)
        run: |
          uv run alembic -c src/ece/migrations/alembic.ini downgrade base
          uv run alembic -c src/ece/migrations/alembic.ini upgrade head

      - name: Seed demo data (PRD §27)
        run: make seed

      # cut-035R2 R1': provision eval datasets + demo docs (force-add workaround
      # for .gitignore wholesale data/ ignore; data/eval/* + data/demo_docs/*
      # previously never committed → CI lacked files → test_s4_1_docs ×3 +
      # test_e2_permission ×1 went red)
      - name: Generate eval datasets (E1-E6; cut-035R2 R1')
        run: make gen-eval-datasets

      - name: Ingest demo docs (POL-2026-03; cut-035R2 R1')
        run: uv run python scripts/ingest_demo_docs.py

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: API docs consistency
        run: make check-api-docs

      - name: Mypy (type check)
        run: uv run mypy src tests

      - name: Import-linter (architecture contract)
        run: uv run lint-imports

      - name: Pytest (unit + integration + security)
        # cut-035R2 R5: -rs makes skipped tests visible (prevent "green but idling"
        # — skip hiding gaps is the next class of fake green). 25 skip sites
        # characterized in reports/cut-035R2-report.md §5.
        run: uv run pytest -m "not eval and not eval_llm" -rs --cov=ece --cov-report=term-missing

      - name: Build (sanity)
        run: uv run python -c "import ece.main; print('build ok:', ece.main.app.title)"
